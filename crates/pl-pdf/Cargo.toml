[package]
name = "pl-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pl-geom.workspace = true
lopdf.workspace = true
# Independent second parser for post-save verification only.
hayro-syntax.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
pl-testkit.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Peak working set in examples/measure.rs only.
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }
