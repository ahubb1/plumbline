[package]
name = "pl-draw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pl-geom.workspace = true
kurbo.workspace = true
tiny-skia.workspace = true
pdf-writer.workspace = true
thiserror.workspace = true
# Glyph outlines and advance widths of the bundled Liberation Sans faces (vendor/fonts), which
# are metric-compatible with the standard-14 Helvetica family the emitter names.
ttf-parser.workspace = true

[dev-dependencies]
# The emitter's output is rendered by PDFium and compared with the tiny-skia raster.
pl-render.workspace = true
# Independent parse of the emitted content streams and of the test documents.
hayro-syntax.workspace = true
