[package]
name = "pl-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# pl-geom and pl-pdf join again with the text layer (M11); the OCR trait needs neither.

[target.'cfg(windows)'.dependencies]
# Windows.Media.Ocr, the engine behind the OCR trait (plan section 4).
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[dev-dependencies]
# The OCR spike renders a fixture page with PDFium and reads it back.
pl-geom.workspace = true
pl-render.workspace = true
pl-testkit.workspace = true
